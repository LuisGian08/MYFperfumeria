services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: myf-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports: [ "1433:1433" ]
    volumes: [ "myf_sql_data:/var/opt/mssql" ]

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: myf-db-init
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database/Create_Databases.sql:/scripts/Create_Databases.sql:ro
    depends_on:
      - sqlserver
    entrypoint: ["/bin/bash", "-c"]
    command: >-
      'SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
      if [ ! -x "$$SQLCMD" ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi;
      until "$$SQLCMD" -S sqlserver -U sa -P "$$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; do sleep 3; done;
      "$$SQLCMD" -S sqlserver -U sa -P "$$DB_PASSWORD" -C -i /scripts/Create_Databases.sql'
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: myf-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports: [ "5672:5672", "15672:15672" ]
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: myf-auth
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=MYF_Auth_DB;user=${DB_USER};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports: [ "8081:8081" ]
    depends_on:
      db-init:
        condition: service_completed_successfully

  product:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: myf-product
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=MYF_Producto_DB;user=${DB_USER};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports: [ "8082:8082" ]
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully

  inventory:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: myf-inventory
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=MYF_Inventario_DB;user=${DB_USER};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
    ports: [ "8083:8083" ]
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  sales:
    build:
      context: .
      dockerfile: sales-service/Dockerfile
    container_name: myf-sales
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=MYF_Venta_DB;user=${DB_USER};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      PRODUCT_SERVICE_URL: http://product:8082
      INVENTORY_SERVICE_URL: http://inventory:8083
    ports: [ "8084:8084" ]
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  alert:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    container_name: myf-alert
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=MYF_Alerta_DB;user=${DB_USER};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
    ports: [ "8085:8085" ]
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  report:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    container_name: myf-report
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=MYF_Reporte_DB;user=${DB_USER};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
    ports: [ "8086:8086" ]
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: myf-gateway
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}"
      AUTH_SERVICE_URL: http://auth:8081
      PRODUCT_SERVICE_URL: http://product:8082
      INVENTORY_SERVICE_URL: http://inventory:8083
      SALES_SERVICE_URL: http://sales:8084
      ALERT_SERVICE_URL: http://alert:8085
      REPORT_SERVICE_URL: http://report:8086
    ports: [ "8080:8080" ]
    depends_on:
      - auth
      - product
      - inventory
      - sales
      - alert
      - report

  frontend:
    build: ./frontend
    container_name: myf-frontend
    ports: [ "5500:80" ]
    volumes:
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on: [ gateway ]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: myf-cloudflared
    profiles: [ "cloudflare" ]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: myf-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - myf_prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    container_name: myf-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-myf-local-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - myf_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  myf_sql_data:
  myf_prometheus_data:
  myf_grafana_data:
