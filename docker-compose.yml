x-sqlserver: &sqlserver
  image: mcr.microsoft.com/mssql/server:2022-latest
  environment:
    ACCEPT_EULA: "Y"
    MSSQL_SA_PASSWORD: ${DB_PASSWORD}
  restart: unless-stopped

x-db-init: &db-init
  image: mcr.microsoft.com/mssql-tools:latest
  environment:
    DB_PASSWORD: ${DB_PASSWORD}
  entrypoint: ["/bin/bash", "-c"]
  restart: "no"

services:
  auth-db:
    <<: *sqlserver
    container_name: myf-auth-db
    ports: [ "127.0.0.1:14331:1433" ]
    volumes:
      - myf_auth_sql_data:/var/opt/mssql
      - ./database/backups:/var/opt/mssql/backup:ro

  product-db:
    <<: *sqlserver
    container_name: myf-product-db
    ports: [ "127.0.0.1:14332:1433" ]
    volumes:
      - myf_product_sql_data:/var/opt/mssql
      - ./database/backups:/var/opt/mssql/backup:ro

  inventory-db:
    <<: *sqlserver
    container_name: myf-inventory-db
    ports: [ "127.0.0.1:14333:1433" ]
    volumes:
      - myf_inventory_sql_data:/var/opt/mssql
      - ./database/backups:/var/opt/mssql/backup:ro

  sales-db:
    <<: *sqlserver
    container_name: myf-sales-db
    ports: [ "127.0.0.1:14334:1433" ]
    volumes:
      - myf_sales_sql_data:/var/opt/mssql
      - ./database/backups:/var/opt/mssql/backup:ro

  db-init-auth:
    <<: *db-init
    container_name: myf-db-init-auth
    volumes:
      - ./database/Create_Auth_Database.sql:/scripts/Create_Database.sql:ro
    depends_on:
      - auth-db
    command: >-
      'SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
      if [ ! -x "$$SQLCMD" ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi;
      until "$$SQLCMD" -S auth-db -U sa -P "$$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; do sleep 3; done;
      "$$SQLCMD" -S auth-db -U sa -P "$$DB_PASSWORD" -C -i /scripts/Create_Database.sql'

  db-init-product:
    <<: *db-init
    container_name: myf-db-init-product
    volumes:
      - ./database/Create_Product_Database.sql:/scripts/Create_Database.sql:ro
    depends_on:
      - product-db
    command: >-
      'SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
      if [ ! -x "$$SQLCMD" ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi;
      until "$$SQLCMD" -S product-db -U sa -P "$$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; do sleep 3; done;
      "$$SQLCMD" -S product-db -U sa -P "$$DB_PASSWORD" -C -i /scripts/Create_Database.sql'

  db-init-inventory:
    <<: *db-init
    container_name: myf-db-init-inventory
    volumes:
      - ./database/Create_Inventory_Database.sql:/scripts/Create_Database.sql:ro
    depends_on:
      - inventory-db
    command: >-
      'SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
      if [ ! -x "$$SQLCMD" ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi;
      until "$$SQLCMD" -S inventory-db -U sa -P "$$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; do sleep 3; done;
      "$$SQLCMD" -S inventory-db -U sa -P "$$DB_PASSWORD" -C -i /scripts/Create_Database.sql'

  db-init-sales:
    <<: *db-init
    container_name: myf-db-init-sales
    volumes:
      - ./database/Create_Sales_Database.sql:/scripts/Create_Database.sql:ro
    depends_on:
      - sales-db
    command: >-
      'SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
      if [ ! -x "$$SQLCMD" ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi;
      until "$$SQLCMD" -S sales-db -U sa -P "$$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; do sleep 3; done;
      "$$SQLCMD" -S sales-db -U sa -P "$$DB_PASSWORD" -C -i /scripts/Create_Database.sql'

  rabbitmq:
    image: rabbitmq:4-management
    container_name: myf-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports: [ "5672:5672", "15672:15672" ]
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: myf-auth
    environment:
      DB_HOST: auth-db
      DB_PORT: 1433
      DB_URL: jdbc:sqlserver://auth-db:1433;databaseName=MYF_Auth_DB;user=${DB_USER};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db-init-auth:
        condition: service_completed_successfully

  product:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: myf-product
    environment:
      DB_HOST: product-db
      DB_PORT: 1433
      DB_URL: jdbc:sqlserver://product-db:1433;databaseName=MYF_Producto_DB;user=${DB_USER};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db-init-product:
        condition: service_completed_successfully

  inventory:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: myf-inventory
    environment:
      DB_HOST: inventory-db
      DB_PORT: 1433
      DB_URL: jdbc:sqlserver://inventory-db:1433;databaseName=MYF_Inventario_DB;user=${DB_USER};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
    depends_on:
      db-init-inventory:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  sales:
    build:
      context: .
      dockerfile: sales-service/Dockerfile
    container_name: myf-sales
    environment:
      DB_HOST: sales-db
      DB_PORT: 1433
      DB_URL: jdbc:sqlserver://sales-db:1433;databaseName=MYF_Venta_DB;user=${DB_USER};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      PRODUCT_SERVICE_URL: http://product:8082
      INVENTORY_SERVICE_URL: http://inventory:8083
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db-init-sales:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: myf-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}"
      AUTH_SERVICE_URL: http://auth:8081
      PRODUCT_SERVICE_URL: http://product:8082
      INVENTORY_SERVICE_URL: http://inventory:8083
      SALES_SERVICE_URL: http://sales:8084
    ports: [ "8080:8080" ]
    depends_on:
      - auth
      - product
      - inventory
      - sales

  frontend:
    build: ./frontend
    container_name: myf-frontend
    ports: [ "5500:80" ]
    volumes:
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on: [ gateway ]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: myf-cloudflared
    profiles: [ "cloudflare" ]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: myf-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - myf_prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    container_name: myf-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-myf-local-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - myf_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  myf_auth_sql_data:
  myf_product_sql_data:
  myf_inventory_sql_data:
  myf_sales_sql_data:
  myf_prometheus_data:
  myf_grafana_data:
