server:
  port: ${GATEWAY_PORT:8080}
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates: [ Path=/api/auth/** ]
            - id: products
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - "Path=/api/productos/**,/api/categorias/**,/api/marcas/**"
            - id: admin-products
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - "Path=/api/admin/productos,/api/admin/productos/**"
            - id: inventory
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates: [ Path=/api/inventario/** ]
            - id: sales
              uri: ${SALES_SERVICE_URL:http://localhost:8084}
              predicates:
                - "Path=/api/ventas/**,/api/clientes/**"
            - id: alerts
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates: [ Path=/api/alertas/** ]
            - id: reports
              uri: ${SALES_SERVICE_URL:http://localhost:8084}
              predicates: [ Path=/api/reportes/** ]
            - id: openapi-auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates: [ Path=/v3/api-docs/auth ]
              filters: [ "RewritePath=/v3/api-docs/auth, /v3/api-docs" ]
            - id: openapi-products
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates: [ Path=/v3/api-docs/products ]
              filters: [ "RewritePath=/v3/api-docs/products, /v3/api-docs" ]
            - id: openapi-inventory
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates: [ Path=/v3/api-docs/inventory ]
              filters: [ "RewritePath=/v3/api-docs/inventory, /v3/api-docs" ]
            - id: openapi-sales
              uri: ${SALES_SERVICE_URL:http://localhost:8084}
              predicates: [ Path=/v3/api-docs/sales ]
              filters: [ "RewritePath=/v3/api-docs/sales, /v3/api-docs" ]
            - id: openapi-alerts
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates: [ Path=/v3/api-docs/alerts ]
              filters: [ "RewritePath=/v3/api-docs/alerts, /v3/api-docs" ]
            - id: openapi-reports
              uri: ${SALES_SERVICE_URL:http://localhost:8084}
              predicates: [ Path=/v3/api-docs/reports ]
              filters: [ "RewritePath=/v3/api-docs/reports, /v3/api-docs" ]
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth
        url: /v3/api-docs/auth
      - name: Products
        url: /v3/api-docs/products
      - name: Inventory
        url: /v3/api-docs/inventory
      - name: Sales
        url: /v3/api-docs/sales
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
jwt:
  secret: ${JWT_SECRET:MYF-Perfumes-Dev-Secret-Key-Change-In-Production-2026-12345}
myf:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}"
