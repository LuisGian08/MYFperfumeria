server:
  port: ${SERVICE_PORT:8082}
spring:
  application:
    name: product-service
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=MYF_Producto_DB;encrypt=true;trustServerCertificate=true
    username: ${DB_USER:myf_app}
    password: ${DB_PASSWORD:MyfApp2026!}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
