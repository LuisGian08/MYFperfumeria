x-sqlserver: &sqlserver
  image: mcr.microsoft.com/mssql/server:2022-latest
  profiles:
    - separated-databases
  environment:
    ACCEPT_EULA: "Y"
    MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  restart: unless-stopped

services:
  auth-db:
    <<: *sqlserver
    container_name: myf-auth-db
    ports:
      - "127.0.0.1:14331:1433"
    volumes:
      - myf_auth_sql_data:/var/opt/mssql

  product-db:
    <<: *sqlserver
    container_name: myf-product-db
    ports:
      - "127.0.0.1:14332:1433"
    volumes:
      - myf_product_sql_data:/var/opt/mssql

  inventory-db:
    <<: *sqlserver
    container_name: myf-inventory-db
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - myf_inventory_sql_data:/var/opt/mssql

  sales-db:
    <<: *sqlserver
    container_name: myf-sales-db
    ports:
      - "127.0.0.1:14334:1433"
    volumes:
      - myf_sales_sql_data:/var/opt/mssql

  alert-db:
    <<: *sqlserver
    container_name: myf-alert-db
    ports:
      - "127.0.0.1:14335:1433"
    volumes:
      - myf_alert_sql_data:/var/opt/mssql

  report-db:
    <<: *sqlserver
    container_name: myf-report-db
    ports:
      - "127.0.0.1:14336:1433"
    volumes:
      - myf_report_sql_data:/var/opt/mssql

volumes:
  myf_auth_sql_data:
  myf_product_sql_data:
  myf_inventory_sql_data:
  myf_sales_sql_data:
  myf_alert_sql_data:
  myf_report_sql_data:
