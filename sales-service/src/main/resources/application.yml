server:
  port: ${SERVICE_PORT:8084}
spring:
  application:
    name: sales-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=MYF_Venta_DB;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

services:
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
