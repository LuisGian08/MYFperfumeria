server:
  port: ${SERVICE_PORT:8081}
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=MYF_Auth_DB;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
jwt:
  secret: ${JWT_SECRET:MYF-Perfumes-Dev-Secret-Key-Change-In-Production-2026-12345}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
